kubeconfigSecret: search-service-kubeconfig

localDevelopment:
  enabled: true
  organization: sap

opensearch:
  url: "http://opensearch-cluster-master.platform-mesh-system.svc.cluster.local:9200"
  username: "admin"
  passwordSecretName: opensearch-admin-auth
  passwordSecretKey: password
  insecure: true

openfga:
  grpcAddr: "openfga.platform-mesh-system.svc.cluster.local:8081"

searchIndex:
  workspacePath: "root:providers:search"
  orgWorkspacePath: "root:orgs"
  group: "search.platform-mesh.io"
  resource: "searchindexes"

hostAliases:
  enabled: true
