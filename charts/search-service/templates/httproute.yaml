apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "common.entity.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  hostnames:
  - "{{ .Values.search.baseDomain }}"
  - "*.{{ .Values.search.baseDomain }}"
  parentRefs:
  - name: k8sapi-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /rest/v1/search  
    backendRefs:
    - group: ""
      kind: Service
      name: {{ include "common.entity.name" . }}
      namespace: {{ .Release.Namespace }}
      port: {{ .Values.service.port }}
