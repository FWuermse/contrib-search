# Registry of the components built from this repository. This is the single
# source for the CI and release workflows (which components exist, where their
# sources are, which images they produce).
#
# Fields:
#   path         directory of the component (module root)
#   image        name of the primary image, pushed as
#                ghcr.io/<owner>/platform-mesh/<image>:<version>
#   chart        the component's Helm chart, if any (charts/<name>). Marks the
#                chart as one whose appVersion is bumped to the release version.
#   e2e          whether `task test-e2e-<name>` exists (default true)

components:
  # --- operators -------------------------------------------------------------
  search-operator:
    path: search-operator
    image: search-operator
    chart: charts/search-operator
    e2e: false

  # --- services --------------------------------------------------------------
  search-service:
    path: search-service
    image: search-service
    chart: charts/search-service
    e2e: false
