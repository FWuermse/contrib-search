# Template for the contrib-search OCM component graph. hack/release/build-aggregate.sh
# fills in the ${VARIABLES} (VERSION/COMPONENT_NAME/REPO_URL/COMMIT) and appends
# the generated per-chart components (see ocm/charts/README.md).

components:
  - name: ${COMPONENT_NAME}
    version: ${VERSION}
    provider:
      name: The Platform Mesh Team
    sources:
      - name: source
        type: git
        version: ${VERSION}
        access:
          type: gitHub
          repoUrl: ${REPO_URL}
          commit: ${COMMIT}
    componentReferences:
      - name: search-operator
        componentName: github.com/platform-mesh/search-operator
        version: ${VERSION}
      - name: search-service
        componentName: github.com/platform-mesh/search-service
        version: ${VERSION}
